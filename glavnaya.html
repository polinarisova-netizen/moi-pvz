<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>График · Главная 58</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f7f9f6;color:#1a3e32}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1300px;margin:auto;padding:24px 12px}h1{font-size:clamp(24px,5vw,32px);margin:8px 0 5px}.muted{color:#73887c;font-size:13px;margin-bottom:20px}.chip{color:#187553;font-weight:700;font-size:13px}.card{background:white;border:1px solid #e1e9e4;border-radius:15px;overflow:auto;box-shadow:0 7px 28px #194c2b0a}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}td,th{padding:11px 7px;min-width:31px;text-align:center;font-size:12px;border-bottom:1px solid #e9ede9}thead th{background:#eef5ef}thead small{display:block;color:#84958b;font-weight:400;margin-top:4px}.name{min-width:116px;max-width:170px;text-align:left;position:sticky;left:0;background:white;z-index:2;padding-left:12px;overflow-wrap:anywhere}.work{background:#dbf1e0;color:#16633d;border-radius:7px;display:inline-block;min-width:22px;padding:5px 0;font-weight:700}.half{background:#ffefc8;color:#856012;border-radius:7px;display:inline-block;min-width:22px;padding:5px 0;font-weight:700}.off{color:#bfcac1}.total{background:#f0f6f0;font-weight:700}.legend{display:flex;gap:16px;flex-wrap:wrap;color:#657a6f;font-size:12px;margin-top:16px}.message{background:#fff5de;padding:16px;border-radius:12px}button{padding:9px 13px;background:#185e4c;color:white;border:none;border-radius:9px;cursor:pointer;margin-top:17px}@media print{body{background:white}.wrap{max-width:none;padding:0}.card{box-shadow:none}button{display:none}.name{position:static}table{font-size:10px}}</style></head><body><main class="wrap"><div class="chip">МОИ ПВЗ · ГРАФИК РАБОТЫ</div><h1>📍 Главная 58</h1><div id="status" class="muted">Подключаем график…</div><div class="card" id="schedule"><div class="message">Загрузка…</div></div><div class="legend"><span>🟢 ● Полная смена</span><span>🟡 ½ Половина смены</span><span>· Выходной</span></div><button onclick="window.print()">Сохранить PDF</button></main><script src="firebase-config.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const id='glavnaya',cfg=window.PVZ_FIREBASE_CONFIG,root=document.getElementById('schedule'),status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mon=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function render(d){const y=+d.year,m=+d.month,n=new Date(y,m+1,0).getDate();if(!Number.isFinite(y)||m<0||m>11||!Array.isArray(d.employees)){root.textContent='Неверный формат графика';return;}
const days=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];let hd='',trs='';for(let i=1;i<=n;i++){hd+=`<th>${i}<small>${days[new Date(y,m,i).getDay()]}</small></th>`;}
for(const e of d.employees){let row='',tot=0;for(let i=1;i<=n;i++){const v=Number(d.shifts?.[e.id+'|'+i]||0);tot+=v;row+=`<td>${v===1?'<span class="work">●</span>':v===.5?'<span class="half">½</span>':'<span class="off">·</span>'}</td>`}trs+=`<tr><th class="name">${esc(e.name)}</th>${row}<td class="total">${tot}</td></tr>`}
root.innerHTML=`<table><thead><tr><th class="name">Сотрудник</th>${hd}<th class="total">Смен</th></tr></thead><tbody>${trs||'<tr><td>Сотрудников пока нет</td></tr>'}</tbody></table>`;
status.textContent=mon[m][0].toUpperCase()+mon[m].slice(1)+' '+y+' · данные обновляются автоматически';}
if(!cfg?.projectId){status.textContent='Облако ещё не настроено';root.innerHTML='<div class="message">Управляющей нужно один раз настроить Firebase и загрузить firebase-config.js на GitHub.</div>';}
else{try{let app=initializeApp(cfg),db=getFirestore(app);onSnapshot(doc(db,'pvzPublic',id),snap=>{if(snap.exists())render(snap.data());else{status.textContent='График ещё не опубликован';root.innerHTML='<div class="message">Открой основное приложение, подключи облако и сохрани график.</div>';}},err=>{status.textContent='Не удалось получить график';root.innerHTML='<div class="message">'+esc(err.message)+'</div>';});}catch(err){status.textContent='Ошибка подключения';root.textContent=err.message;}}
</script></body></html>
