<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193d37"><title>Мои ПВЗ · график и зарплаты</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18372f;background:#f6f8f5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:22px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:11px}.mark{height:42px;width:42px;border-radius:14px;display:grid;place-items:center;color:white;background:#19574b;font-size:22px}h1{font-size:23px;margin:0;letter-spacing:-.7px}.muted{color:#77847c;font-size:13px}.actions,.tabs,.control{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #d9e2dc;background:white;border-radius:11px;padding:11px 14px;color:#25483d;font-weight:600}button:hover{background:#f0f6f2}button.primary{color:#fff;background:#195b4b;border-color:#195b4b}button.primary:hover{background:#12483d}button.small{padding:7px 9px;font-size:12px}.btn-text{border:0;background:transparent}.tabs{border-bottom:1px solid #dae3dd;margin-bottom:20px}.tab{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:13px 17px;color:#78867d}.tab.active{color:#155647;border-bottom-color:#155647}.panel{background:#fff;border:1px solid #e0e8e2;border-radius:18px;padding:20px;box-shadow:0 9px 26px #274a310a;margin-bottom:16px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0 0 12px}.month{display:flex;align-items:center;gap:10px}.month label{font-size:15px;font-weight:700;min-width:150px;text-align:center}input[type=text],input[type=number],select{border-radius:9px;border:1px solid #dce5de;background:#fff;padding:9px;color:#18372f;min-width:0}input[type=number]{width:116px}.hint{background:#eff6f0;border-radius:12px;padding:12px 14px;font-size:13px;color:#426154;margin:12px 0}.gridwrap{overflow:auto;border:1px solid #e1e8e1;border-radius:12px}.schedule{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}.schedule th,.schedule td{padding:0;text-align:center;min-width:35px;border-bottom:1px solid #edf1ed;border-right:1px solid #edf1ed;height:42px}.schedule th{background:#f3f7f2;height:45px;white-space:nowrap;color:#557064}.schedule .staff{position:sticky;left:0;min-width:145px;width:145px;text-align:left;padding-left:12px;background:#fff;z-index:1;font-weight:600}.schedule th.staff{background:#e8f0e8;z-index:2}.schedule .weekend{background:#fff5f0}.schedule th.weekend{background:#f9e8df}.slot{width:100%;height:42px;border:0;border-radius:0;background:transparent;padding:0;font-size:12px;font-weight:700;color:#b6c3ba}.slot[data-v="1"]{background:#d2eadc;color:#17654b}.slot[data-v="0.5"]{background:#fff0ca;color:#855f16}.slot:hover{outline:2px solid #2c7c64;outline-offset:-2px}.totcol{background:#f1f7f3!important;min-width:65px!important;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#f5f8f4;border-radius:14px;padding:16px}.stat .value{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:8px}.stat .caption{font-size:12px;color:#74887b}.employee{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2ec}.employee:last-child{border-bottom:0}.employee input[type=text]{width:100%}.empty{color:#71847b;font-size:13px;padding:10px}.paytable{border-collapse:collapse;width:100%;font-size:13px}.paytable th,.paytable td{padding:11px;border-bottom:1px solid #e8eee8;text-align:left}.paytable th{font-size:12px;color:#72837a;background:#f5f8f3}.paytable td.money{font-weight:700;white-space:nowrap}.paytable input[type=checkbox]{accent-color:#1a7057;width:17px;height:17px}.pill{display:inline-flex;align-items:center;font-size:11px;border-radius:12px;padding:4px 8px;background:#e7f3e9;color:#25634a}.warning{background:#fff4d9;color:#775b1b}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hide{display:none!important}.foot{margin-top:17px;color:#86948b;font-size:12px}.readmode .editorOnly{display:none!important}.readmode .slot{pointer-events:none}.readmode button.slot{cursor:default}.notice{background:#e9f3ea;padding:10px 12px;border-radius:10px;margin-bottom:16px;font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:#183d33;color:white;border-radius:12px;padding:14px 18px;box-shadow:0 8px 30px #0003;display:none;z-index:99}.compact{font-size:12px}.summaryrow{padding:14px 0;border-bottom:1px solid #e8eee8;display:flex;justify-content:space-between;gap:10px}.summaryrow:last-child{border-bottom:none}@media(max-width:700px){.shell{padding:15px 10px 50px}.panel{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.employee{grid-template-columns:1.3fr 1fr auto}.top{align-items:flex-start}.actions button{font-size:12px;padding:9px 10px}.stat .value{font-size:20px}.schedule .staff{min-width:106px;width:106px;padding-left:7px}.tabs{gap:0}.tab{padding:12px}}@media print{body{background:#fff}.shell{max-width:none;padding:0}.top .actions,.editorOnly,.tabs,.foot,.toast,.hint{display:none!important}.panel{box-shadow:none;border:0;padding:0}.gridwrap{overflow:visible}.schedule{font-size:9px}.schedule th,.schedule td{min-width:22px;height:26px}.slot{height:26px}.schedule .staff{min-width:95px;width:95px}button{border:0}h1{font-size:17px}.sectionhead{margin-bottom:8px}}
.pay-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}.pay-summary-card{background:#f0f7f1;border:1px solid #dce9df;border-radius:14px;padding:16px}.pay-summary-amount{font-size:26px;letter-spacing:-.5px;font-weight:800;color:#174f3e;margin:9px 0}.pay-summary-meta{font-size:12px;color:#687e70}.pay-summary-remaining{margin-top:11px;padding-top:10px;border-top:1px solid #dae7de;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between}.pay-total td{background:#eaf3ec;font-weight:700;border-top:2px solid #b9d4c1}.pay-summary-footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:15px;color:#285a45;font-size:13px}.pay-summary-footer span{color:#71847b}@media(max-width:700px){.pay-summary-grid{grid-template-columns:1fr}.pay-summary-amount{font-size:22px}}
</style></head><body><div class="shell" id="app"><header class="top"><div class="logo"><div class="mark">▦</div><div><h1>Мои ПВЗ</h1><div class="muted" id="subtitle">Графики и зарплаты без подписок</div></div></div><div class="actions"><button id="printBtn">🖨 PDF / печать</button><button class="editorOnly" id="downloadBtn">↓ Сохранить копию</button><button class="primary editorOnly" id="shareBtn">↗ Ссылка на выбранный ПВЗ</button></div></header><div id="readNotice" class="notice hide">🔒 График для просмотра. Изменять смены здесь нельзя.</div><nav class="tabs"><button class="tab active" data-tab="schedule">📅 График смен</button><button class="tab editorOnly" data-tab="staff">👥 Сотрудники</button><button class="tab editorOnly" data-tab="pay">₽ Зарплаты</button><button class="tab editorOnly" data-tab="overview">▤ Сводка</button></nav><main id="main"></main><div class="foot" id="foot">Данные автоматически сохраняются в этом браузере. Для надёжности периодически нажимай «Сохранить копию».</div><input type="file" id="fileInput" accept=".json" class="hide"><div class="toast" id="toast"></div></div><script>
'use strict';
const STORAGE='moi-pvz-v1'; const monthNames=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const today=new Date();const defaultData=()=>({year:today.getFullYear(),month:today.getMonth(),locations:[{id:'glavnaya',name:'Главная 58'},{id:'popova',name:'Попова 43'}],employees:[],shifts:{},paid:{}});
let readOnly=location.hash.startsWith('#view=');let data=defaultData();let tab='schedule',currentLoc='glavnaya';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function key(loc,emp,year,month,day){return [loc,emp,year,month,day].join('|')};function paykey(loc,emp,year,month,half){return [loc,emp,year,month,half].join('|')};
function validate(x){if(!x||!Array.isArray(x.locations)||!Array.isArray(x.employees)||typeof x.shifts!=='object')throw Error('Неверный формат графика');return {year:Number(x.year)||today.getFullYear(),month:Math.min(11,Math.max(0,Number(x.month)||0)),locations:x.locations.slice(0,10).map(l=>({id:String(l.id).slice(0,60),name:String(l.name).slice(0,100)})),employees:x.employees.slice(0,100).map(e=>({id:String(e.id),name:String(e.name).slice(0,100),rate:Math.max(0,Number(e.rate)||0),locations:Array.isArray(e.locations)?e.locations.map(String):[]})),shifts:x.shifts||{},paid:x.paid||{}}}
function unpack(s){let binary=atob(s.replace(/-/g,'+').replace(/_/g,'/'));let bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function pack(x){const b=new TextEncoder().encode(JSON.stringify(x));let binary='';for(let i=0;i<b.length;i++)binary+=String.fromCharCode(b[i]);return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
try{if(readOnly){data=validate(unpack(location.hash.slice(6)))}else{let saved=localStorage.getItem(STORAGE);if(saved)data=validate(JSON.parse(saved))}}catch(e){readOnly=false;alert('Не удалось открыть сохранённый график. Открыта пустая версия.');}
function save(){if(!readOnly){localStorage.setItem(STORAGE,JSON.stringify(data));document.getElementById('subtitle').textContent='✓ Сохранено на этом устройстве'}}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.style.display='block';clearTimeout(window._toastTimeout);window._toastTimeout=setTimeout(()=>x.style.display='none',3500)}
function daysIn(y,m){return new Date(y,m+1,0).getDate()};function money(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function getShift(loc,emp,d){return Number(data.shifts[key(loc,emp,data.year,data.month,d)]||0)}
function empIn(loc){return data.employees.filter(e=>e.locations.includes(loc))}
function totalFor(loc,e,from,to){let z=0;for(let d=from;d<=to;d++)z+=getShift(loc,e.id,d);return z}
function monthSelector(){return `<div class="month"><button class="small" data-dir="-1">←</button><label>${monthNames[data.month][0].toUpperCase()+monthNames[data.month].slice(1)} ${data.year}</label><button class="small" data-dir="1">→</button></div>`}
function locSelector(){return `<div class="control">${data.locations.map(l=>`<button data-loc="${esc(l.id)}" class="small ${currentLoc===l.id?'primary':''}">${esc(l.name)}</button>`).join('')}</div>`}
function schedule(){let l=data.locations.find(l=>l.id===currentLoc)||data.locations[0];if(!l)return '';let emps=empIn(l.id),days=daysIn(data.year,data.month);let colhead='',headweek='';for(let d=1;d<=days;d++){const day=new Date(data.year,data.month,d).getDay();let w=day===0||day===6?' weekend':'';colhead+=`<th class="${w}">${d}</th>`;headweek+=`<th class="${w}">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][day]}</th>`}
let rows=emps.map(e=>{let cells='';for(let d=1;d<=days;d++){let s=getShift(l.id,e.id,d);let w=[0,6].includes(new Date(data.year,data.month,d).getDay())?'weekend':'';cells+=`<td class="${w}"><button class="slot" data-slot="${esc(l.id)}|${esc(e.id)}|${d}" data-v="${s}" title="${esc(e.name)}, ${d} ${monthNames[data.month]}: ${s===0?'выходной':s===1?'полная смена':'полсмены'}">${s===0?'·':s===1?'●':'½'}</button></td>`}return `<tr><td class="staff">${esc(e.name)}</td>${cells}<td class="totcol">${Number(totalFor(l.id,e,1,days).toFixed(1))}</td></tr>`}).join('');let count=emps.reduce((a,e)=>a+totalFor(l.id,e,1,days),0);return `<section class="panel"><div class="sectionhead"><div><h2>График смен</h2><div class="muted">Нажимай на ячейку: выходной → смена → ½ смены → выходной</div></div>${monthSelector()}</div>${locSelector()}<div class="hint">🟢 Полная смена (1) &nbsp;&nbsp; 🟡 Полсмены (½) &nbsp;&nbsp; · Выходной ${readOnly?'':'&nbsp; · Изменения сохраняются сами'}</div><div class="gridwrap"><table class="schedule"><thead><tr><th class="staff">Сотрудник</th>${colhead}<th class="totcol">Смен</th></tr><tr><th class="staff">День недели</th>${headweek}<th class="totcol">∑</th></tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${days+2}">${readOnly?'Сотрудников пока нет':'Добавь сотрудников во вкладке «Сотрудники»'}</td></tr>`}</tbody></table></div><div class="foot">${emps.length} сотрудников · ${count} смен ${readOnly?'':'· начислено '+money(emps.reduce((a,e)=>a+totalFor(l.id,e,1,days)*e.rate,0))} </div></section>`}
function employeesPage(){let html=data.locations.map(l=>{let es=empIn(l.id);return `<section class="panel"><div class="sectionhead"><h2>📍 ${esc(l.name)}</h2><span class="muted">${es.length} сотрудников</span></div>${es.map(e=>`<div class="employee"><input type="text" data-ename="${esc(e.id)}" value="${esc(e.name)}" placeholder="Имя сотрудника"><input type="number" min="0" step="50" data-rate="${esc(e.id)}" value="${e.rate}" title="Ставка за полную смену"><button class="small" data-remove="${esc(e.id)}|${esc(l.id)}" title="Убрать из ПВЗ">✕</button></div>`).join('')}<button class="small primary" data-add="${esc(l.id)}" style="margin-top:15px">+ Добавить сотрудника</button><p class="muted">Ставка — в ₽ за одну полную смену. Если человек работает на двух точках, используй «Добавить существующего».</p><button class="small" data-addExisting="${esc(l.id)}">Добавить существующего сотрудника на точку</button></section>`}).join('');return `<div class="two">${html}</div><div class="hint">💡 Для сохранения уже составленного графика не меняй имена сотрудников через удаление — редактируй имя прямо в поле.</div>`}
function payday(y,m,half){let yy=y,mm=m;if(half===2){mm++;if(mm===12){mm=0;yy++}}return String(half===1?25:10).padStart(2,'0')+'.'+String(mm+1).padStart(2,'0')+'.'+yy}
function payPage(){
  const end=daysIn(data.year,data.month);
  const blocks=data.locations.map(l=>{
    let rows='';
    let total1=0,total2=0,paid1=0,paid2=0,shifts1=0,shifts2=0;
    for(const e of empIn(l.id)){
      const n1=totalFor(l.id,e,1,15),n2=totalFor(l.id,e,16,end),a=n1*e.rate,b=n2*e.rate;
      const p1=Boolean(data.paid[paykey(l.id,e.id,data.year,data.month,1)]);
      const p2=Boolean(data.paid[paykey(l.id,e.id,data.year,data.month,2)]);
      shifts1+=n1;shifts2+=n2;total1+=a;total2+=b;
      if(p1)paid1+=a;if(p2)paid2+=b;
      rows+=`<tr><td>${esc(e.name)}</td><td>${n1} / ${n2}</td><td class="money">${money(a)}</td><td><input type="checkbox" data-paid="${esc(paykey(l.id,e.id,data.year,data.month,1))}" ${p1?'checked':''}></td><td class="money">${money(b)}</td><td><input type="checkbox" data-paid="${esc(paykey(l.id,e.id,data.year,data.month,2))}" ${p2?'checked':''}></td></tr>`;
    }
    const remaining1=total1-paid1,remaining2=total2-paid2;
    return `<section class="panel"><div class="sectionhead"><h2>📍 ${esc(l.name)}</h2><span class="pill">Всего за месяц: ${money(total1+total2)}</span></div>
      <div class="pay-summary-grid">
        <div class="pay-summary-card"><div class="muted">1–15 ${monthNames[data.month]} · выплата ${payday(data.year,data.month,1)}</div><div class="pay-summary-amount">${money(total1)}</div><div class="pay-summary-meta">${shifts1} смен · выплачено: ${money(paid1)}</div><div class="pay-summary-remaining">Осталось выплатить: <strong>${money(remaining1)}</strong></div></div>
        <div class="pay-summary-card"><div class="muted">16–${end} ${monthNames[data.month]} · выплата ${payday(data.year,data.month,2)}</div><div class="pay-summary-amount">${money(total2)}</div><div class="pay-summary-meta">${shifts2} смен · выплачено: ${money(paid2)}</div><div class="pay-summary-remaining">Осталось выплатить: <strong>${money(remaining2)}</strong></div></div>
      </div>
      <div class="gridwrap"><table class="paytable"><thead><tr><th>Сотрудник</th><th>Смен 1–15 / 16–${end}</th><th>К выплате ${payday(data.year,data.month,1)}</th><th>Оплачено</th><th>К выплате ${payday(data.year,data.month,2)}</th><th>Оплачено</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Добавь сотрудников</td></tr>'}<tr class="pay-total"><td><strong>Итого по ПВЗ</strong></td><td><strong>${shifts1} / ${shifts2}</strong></td><td class="money">${money(total1)}</td><td></td><td class="money">${money(total2)}</td><td></td></tr></tbody></table></div>
      <div class="pay-summary-footer"><strong>Общий долг по ПВЗ: ${money(remaining1+remaining2)}</strong><span>Из начисленных ${money(total1+total2)}</span></div>
    </section>`;
  }).join('');
  return `<section class="panel"><div class="sectionhead"><h2>Начисления за ${monthNames[data.month]} ${data.year}</h2>${monthSelector()}</div><div class="hint">📅 За 1–15 число выплата <b>25-го числа</b> этого же месяца. За 16–${end} — <b>10-го числа следующего месяца</b>. Галочки «Оплачено» выставляй после перевода. Налоги, удержания и надбавки не включены. Отметка оплаты считается за весь период сотрудника.</div></section>${blocks}`;
}
function overview(){let days=daysIn(data.year,data.month);let cards=data.locations.map(l=>{let es=empIn(l.id),n=es.reduce((a,e)=>a+totalFor(l.id,e,1,days),0),w=es.reduce((a,e)=>a+e.rate*totalFor(l.id,e,1,days),0);return `<div class="stat"><div class="caption">${esc(l.name)}</div><div class="value">${money(w)}</div><div class="muted">${n} смен · ${es.length} сотрудников</div></div>`}).join('');let due=[0,0],debt=[0,0];for(let l of data.locations)for(let e of empIn(l.id))for(let half=1;half<=2;half++){let from=half===1?1:16,to=half===1?15:days;let a=totalFor(l.id,e,from,to)*e.rate;due[half-1]+=a;if(!data.paid[paykey(l.id,e.id,data.year,data.month,half)])debt[half-1]+=a}return `<section class="panel"><div class="sectionhead"><h2>Сводка · ${monthNames[data.month]} ${data.year}</h2>${monthSelector()}</div><div class="stats"><div class="stat"><div class="caption">Всего начислено</div><div class="value">${money(due[0]+due[1])}</div></div><div class="stat"><div class="caption">Ещё не выплачено</div><div class="value">${money(debt[0]+debt[1])}</div></div>${cards}</div></section><section class="panel"><h2>Ближайшие выплаты по выбранному месяцу</h2><div class="summaryrow"><span>25-е число · период 1–15</span><strong>${money(debt[0])} / ${money(due[0])}</strong></div><div class="summaryrow"><span>10-е следующего месяца · период 16–${days}</span><strong>${money(debt[1])} / ${money(due[1])}</strong></div><p class="muted">Слева от косой черты — ещё не выплачено, справа — всего начислено.</p></section><section class="panel editorOnly"><h2>Резервная копия данных</h2><p class="muted">Храни копию графика отдельно, если очищаешь браузер или меняешь устройство.</p><div class="actions"><button id="backupAgain">↓ Скачать резервную копию (.json)</button><button id="importBtn">↑ Восстановить из файла</button></div></section>`}
function render(){document.body.classList.toggle('readmode',readOnly);document.getElementById('readNotice').classList.toggle('hide',!readOnly);if(readOnly){tab='schedule';currentLoc=data.locations[0]?.id||currentLoc;}document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.getElementById('main').innerHTML=tab==='schedule'?schedule():tab==='staff'?employeesPage():tab==='pay'?payPage():overview();document.getElementById('foot').textContent=readOnly?'Только график выбранного ПВЗ. Без ставок и зарплат. При изменении смен нужна новая ссылка.':'Данные автоматически сохраняются только в этом браузере. Чтобы не потерять их, скачивай резервную копию.'}
function changeMonth(dir){if(readOnly)return;let d=new Date(data.year,data.month+dir,1);data.year=d.getFullYear();data.month=d.getMonth();save();render()}
function downloadBlob(name,content,type){let a=document.createElement('a');let url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function backup(){downloadBlob('Мои-ПВЗ-резервная-копия.json',JSON.stringify(data,null,2),'application/json');toast('Резервная копия скачана')}
function makePublicData(locId){
  const loc=data.locations.find(l=>l.id===locId);
  if(!loc)throw Error('ПВЗ не найден');
  const employees=empIn(locId).map(e=>({id:e.id,name:e.name,rate:0,locations:[locId]}));
  const shifts={};
  for(const e of employees)for(let d=1;d<=daysIn(data.year,data.month);d++){
    const k=key(locId,e.id,data.year,data.month,d);
    if(data.shifts[k])shifts[k]=data.shifts[k];
  }
  return {year:data.year,month:data.month,locations:[{id:loc.id,name:loc.name}],employees,shifts,paid:{}};
}
async function share(){
  if(location.protocol==='file:'){
    alert('Для ссылки на график нужно открыть опубликованную версию на GitHub Pages.');return;
  }
  const l=data.locations.find(l=>l.id===currentLoc)||data.locations[0];
  if(!l){toast('Сначала создай ПВЗ');return}
  const u=location.href.split('#')[0]+'#view='+pack(makePublicData(l.id));
  try{await navigator.clipboard.writeText(u);toast('Ссылка на «'+l.name+'» скопирована!');}
  catch(e){prompt('Ссылка только на '+l.name+' (скопируй её):',u)}
}
function addEmp(loc){let name=prompt('Как зовут сотрудника?');if(!name||!name.trim())return;let rate=prompt('Ставка за полную смену (₽):','3500');if(rate===null)return;data.employees.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name.trim(),rate:Math.max(0,Number(rate.replace(',','.'))||0),locations:[loc]});save();render()}
function existing(loc){let options=data.employees.filter(e=>!e.locations.includes(loc));if(!options.length){toast('Нет сотрудников с другой точки');return}let name=prompt('Укажи номер сотрудника:\n'+options.map((e,i)=>`${i+1}. ${e.name}`).join('\n'));let n=Number(name)-1;if(options[n]){options[n].locations.push(loc);save();render()}}
function removeEmp(raw){let [emp,loc]=raw.split('|');let e=data.employees.find(e=>e.id===emp);if(!e||!confirm(`Убрать ${e.name} из ПВЗ? Смены на этой точке останутся в резервной копии.`))return;e.locations=e.locations.filter(x=>x!==loc);save();render()}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.dir){changeMonth(Number(b.dataset.dir))}else if(b.dataset.loc){currentLoc=b.dataset.loc;render()}else if(b.dataset.slot&&!readOnly){let [loc,emp,day]=b.dataset.slot.split('|'),k=key(loc,emp,data.year,data.month,day),s=Number(data.shifts[k]||0),next=s===0?1:s===1?.5:0;if(next)data.shifts[k]=next;else delete data.shifts[k];save();render()}else if(b.dataset.add){addEmp(b.dataset.add)}else if(b.dataset.addExisting){existing(b.dataset.addExisting)}else if(b.dataset.remove){removeEmp(b.dataset.remove)}else if(b.id==='downloadBtn'||b.id==='backupAgain'){backup()}else if(b.id==='shareBtn'){share()}else if(b.id==='printBtn'){window.print()}else if(b.id==='importBtn'){document.getElementById('fileInput').click()}});
document.addEventListener('change',ev=>{let el=ev.target;if(el.dataset.ename){let e=data.employees.find(x=>x.id===el.dataset.ename);if(e)e.name=el.value.trim()||e.name;save();render()}else if(el.dataset.rate){let e=data.employees.find(x=>x.id===el.dataset.rate);if(e)e.rate=Math.max(0,Number(el.value)||0);save();render()}else if(el.dataset.paid){data.paid[el.dataset.paid]=el.checked;save();render()}else if(el.id==='fileInput'&&el.files[0]){let r=new FileReader();r.onload=()=>{try{if(!confirm('Заменить текущие данные содержимым резервной копии?'))return;data=validate(JSON.parse(r.result));save();render();toast('Данные восстановлены')}catch(e){alert('Не удалось открыть резервную копию')}};r.readAsText(el.files[0]);el.value=''}});
render();</script></body></html>
