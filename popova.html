<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>График · Попова 43</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f7f9f6;color:#1a3e32}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1300px;margin:auto;padding:24px 12px}h1{font-size:clamp(24px,5vw,32px);margin:8px 0 5px}.muted{color:#73887c;font-size:13px;margin-bottom:20px}.chip{color:#187553;font-weight:700;font-size:13px}.card{background:white;border:1px solid #e1e9e4;border-radius:15px;overflow:auto;box-shadow:0 7px 28px #194c2b0a}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}td,th{padding:11px 7px;min-width:31px;text-align:center;font-size:12px;border-bottom:1px solid #e9ede9}thead th{background:#eef5ef}thead small{display:block;color:#84958b;font-weight:400;margin-top:4px}.name{min-width:116px;max-width:170px;text-align:left;position:sticky;left:0;background:white;z-index:2;padding-left:12px;overflow-wrap:anywhere}.work{display:block;background:#17654b;color:white;padding:11px 1px;font-weight:800;min-height:41px;margin:-11px -7px;border-radius:0}.half{display:block;background:#f9ebca;color:#765817;padding:11px 1px;min-height:41px;margin:-11px -7px;border-radius:0;font-weight:700}.off{color:#aab9ae}.card tbody tr:nth-child(even) td{background:#f8faf7}.card tbody tr:nth-child(even) td:has(.work){background:#17654b}.total{background:#f0f6f0;font-weight:700}.legend{display:flex;gap:16px;flex-wrap:wrap;color:#657a6f;font-size:12px;margin-top:16px}.message{background:#fff5de;padding:16px;border-radius:12px}.monthnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.monthnav button{margin:0;padding:9px 14px}.monthnav strong{min-width:165px;text-align:center}.monthnav button.current{background:#e1eee5;color:#185e4c}.monthnav button:disabled{opacity:.5;cursor:default}button{padding:9px 13px;background:#185e4c;color:white;border:none;border-radius:9px;cursor:pointer;margin-top:17px}@media print{body{background:white}.wrap{max-width:none;padding:0}.card{box-shadow:none}.monthnav{display:none}button{display:none}.name{position:static}table{font-size:10px}}
/* Аккуратные зазоры и выделение сегодняшнего столбца */
table{border-spacing:3px 3px;}
td,th{border-bottom:0;}
tbody td{background:#f6f9f6;}
.work,.half{margin:0;min-height:37px;padding:10px 1px;border-radius:5px;border:1px solid #12533f;}
.work{background:#17654b;}
.half{border-color:#e8d59d;}
.card tbody tr:nth-child(even) td:has(.work){background:transparent;}
.card tbody tr:nth-child(even) td{background:#f7faf7;}
.card tbody tr td:has(.work){background:transparent;}
.today-col{background:#e8f2e8!important;box-shadow:inset 2px 0 #b4d1bc,inset -2px 0 #b4d1bc;}
thead th.today-col{background:#dcecdc!important;color:#215e47;font-weight:800;}
</style></head><body><main class="wrap"><div class="chip">МОИ ПВЗ · ГРАФИК РАБОТЫ</div><h1>📍 Попова 43</h1><div class="monthnav"><button type="button" id="prevMonth" aria-label="Предыдущий месяц">←</button><strong id="selectedMonth">—</strong><button type="button" id="nextMonth" aria-label="Следующий месяц">→</button><button type="button" id="currentMonth" class="current">Текущий месяц</button></div><div id="status" class="muted">Подключаем график…</div><div class="card" id="schedule"><div class="message">Загрузка…</div></div><div class="legend"><span>■ Зелёная ячейка — рабочий день</span><span>— Выходной</span></div><button onclick="window.print()">Сохранить PDF</button></main><script src="firebase-config.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const id='popova',cfg=window.PVZ_FIREBASE_CONFIG,root=document.getElementById('schedule'),status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const days=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
let now=new Date(),selectedYear=now.getFullYear(),selectedMonth=now.getMonth(),currentData=null;
function render(){
 const y=selectedYear,m=selectedMonth,n=new Date(y,m+1,0).getDate();
 document.getElementById('selectedMonth').textContent=months[m]+' '+y;
 const isCurrent=y===new Date().getFullYear()&&m===new Date().getMonth();
 document.getElementById('currentMonth').disabled=isCurrent;
 if(!currentData){root.innerHTML='<div class="message">График ещё не опубликован.</div>';return;}
 const d=currentData;
 if(!Array.isArray(d.employees)){root.textContent='Неверный формат графика';return;}
 let hd='',trs='';
 for(let i=1;i<=n;i++)hd+=`<th class="${y===now.getFullYear()&&m===now.getMonth()&&i===now.getDate()?'today-col':''}">${i}<small>${days[new Date(y,m,i).getDay()]}</small></th>`;
 for(const e of d.employees){
  let row='',tot=0;
  for(let i=1;i<=n;i++){
   // Новый формат хранит все месяцы; старые данные прежней версии тоже читаются.
   let v=Number(d.shifts?.[y+'|'+m+'|'+e.id+'|'+i]||0);
   if(!v&&Number(d.year)===y&&Number(d.month)===m)v=Number(d.shifts?.[e.id+'|'+i]||0);
   tot+=v;
   row+=`<td class="${y===now.getFullYear()&&m===now.getMonth()&&i===now.getDate()?'today-col':''}">${v===1?'<span class="work"></span>':v===.5?'<span class="half">½</span>':'<span class="off">—</span>'}</td>`;
  }
  trs+=`<tr><th class="name">${esc(e.name)}</th>${row}<td class="total">${tot}</td></tr>`;
 }
 root.innerHTML=`<table><thead><tr><th class="name">Сотрудник</th>${hd}<th class="total">Смен</th></tr></thead><tbody>${trs||'<tr><td>Сотрудников пока нет</td></tr>'}</tbody></table>`;
 const hasAny=Object.keys(d.shifts||{}).some(k=>k.startsWith(y+'|'+m+'|')) || (Number(d.year)===y&&Number(d.month)===m&&Object.keys(d.shifts||{}).some(k=>!/^\d{4}\|/.test(k)));
 status.textContent=hasAny?'Данные обновляются автоматически · только просмотр':'Смен за выбранный месяц пока нет · только просмотр';
}
function switchMonth(offset){const d=new Date(selectedYear,selectedMonth+offset,1);selectedYear=d.getFullYear();selectedMonth=d.getMonth();render()}
document.getElementById('prevMonth').addEventListener('click',()=>switchMonth(-1));
document.getElementById('nextMonth').addEventListener('click',()=>switchMonth(1));
document.getElementById('currentMonth').addEventListener('click',()=>{const d=new Date();selectedYear=d.getFullYear();selectedMonth=d.getMonth();render()});
if(!cfg?.projectId){status.textContent='Облако ещё не настроено';root.innerHTML='<div class="message">Управляющей нужно настроить Firebase.</div>'}
else try{
 const app=initializeApp(cfg),db=getFirestore(app);
 onSnapshot(doc(db,'pvzPublic',id),snap=>{if(snap.exists()){currentData=snap.data();render()}else{currentData=null;status.textContent='График ещё не опубликован';render()}},error=>{status.textContent='Не удалось получить график';root.innerHTML='<div class="message">'+esc(error.message)+'</div>'});
}catch(error){status.textContent='Ошибка подключения';root.textContent=error.message}
render();
</script></body></html>
